version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: Password1
      POSTGRES_DB: ordenes_servicio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Monta el código local para recarga automática
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://usuario:contraseña@db:5432/ordenes_servicio
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  redis_data: